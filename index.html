<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر السيرة الذاتية التفاعلي الشامل</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #334155;
            display: flex;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            flex-direction: row;
        }

        /* لوحة التعديل والتحكم */
        .editor-panel {
            width: 45%;
            padding: 20px;
            background-color: #ffffff;
            border-left: 2px solid #e2e8f0;
            height: 100vh;
            overflow-y: auto;
        }

        .editor-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            z-index: 10;
        }

        .btn-print {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-print:hover { background-color: #1d4ed8; }

        .section-editor {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .section-editor h3 {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .form-group { margin-bottom: 8px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 2px;
            color: #475569;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            background-color: #fff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        .btn-add {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-add:hover { background-color: #059669; }

        .btn-del {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            float: left;
        }
        .btn-del:hover { background-color: #dc2626; }

        .item-editor-card {
            background: white;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        /* لوحة المعاينة */
        .preview-panel {
            width: 55%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #cbd5e1;
            height: 100vh;
            overflow-y: auto;
        }

        .cv-page {
            width: 210mm;
            min-height: 297mm;
            background-color: white;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            font-size: 13px;
            box-sizing: border-box;
        }

        .cv-name {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 20px;
            color: #000;
        }

        .section-box {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .section-header {
            background-color: #3d5a80;
            color: white;
            padding: 6px 15px;
            font-weight: bold;
            font-size: 14px;
            text-align: right;
            transition: background-color 0.2s;
        }

        .section-body { padding: 10px 15px; }

        /* محاذاة البيانات الشخصية المنظمة رأساً لليمين */
        .personal-info-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .personal-info-row b {
            width: 170px;
            min-width: 170px;
            text-align: right;
            white-space: nowrap;
        }

        .personal-info-row span {
            text-align: right;
            flex: 1;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2px;
        }

        .item-desc {
            color: #475569;
            font-size: 12px;
            margin-top: 3px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .color-picker { display: flex; gap: 8px; margin-bottom: 15px; }
        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .color-btn.active { border-color: #000; transform: scale(1.1); }

        @media print {
            .editor-panel { display: none !important; }
            .preview-panel { width: 100% !important; background: white !important; padding: 0 !important; height: auto !important; }
            .cv-page { box-shadow: none !important; width: 100% !important; padding: 0 !important; }
            @page { size: A4; margin: 15mm; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوحة التحكم وتعديل كافة البيانات -->
        <div class="editor-panel">
            <div class="editor-title">
                <span>محرر السيرة الذاتية</span>
                <button class="btn-print" onclick="window.print()">📥 طباعة / حفظ PDF</button>
            </div>

            <!-- اختيار لون السمة -->
            <label style="font-size: 12px; font-weight: bold;">لون العناوين:</label>
            <div class="color-picker">
                <div class="color-btn active" style="background-color: #3d5a80;" onclick="changeColor('#3d5a80', this)"></div>
                <div class="color-btn" style="background-color: #1e293b;" onclick="changeColor('#1e293b', this)"></div>
                <div class="color-btn" style="background-color: #065f46;" onclick="changeColor('#065f46', this)"></div>
                <div class="color-btn" style="background-color: #991b1b;" onclick="changeColor('#991b1b', this)"></div>
            </div>

            <!-- البيانات الشخصية -->
            <div class="section-editor">
                <h3>البيانات الشخصية</h3>
                <div class="form-group"><label>الاسم الكامل</label><input type="text" id="in-name" value="عبدالله حسن المصري" oninput="render()"></div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="text" id="in-email" value="abdallahelmasry541@gmail.com" oninput="render()"></div>
                <div class="form-group"><label>الهاتف</label><input type="text" id="in-phone" value="0582144696" oninput="render()"></div>
                <div class="form-group"><label>العنوان</label><input type="text" id="in-address" value="المدينة المنورة" oninput="render()"></div>
                <div class="form-group"><label>تاريخ الميلاد</label><input type="text" id="in-birth" value="1 فبراير 2003" oninput="render()"></div>
                <div class="form-group"><label>الجنسية</label><input type="text" id="in-nat" value="مصري" oninput="render()"></div>
                <div class="form-group"><label>الحالة الاجتماعية</label><input type="text" id="in-status" value="أعزب" oninput="render()"></div>
            </div>

            <!-- المؤهلات الدراسية -->
            <div class="section-editor">
                <h3>المؤهلات الدراسية</h3>
                <div id="edu-inputs"></div>
                <button class="btn-add" onclick="addEdu()">+ إضافة مؤهل</button>
            </div>

            <!-- الخبرة العملية -->
            <div class="section-editor">
                <h3>الخبرة العملية</h3>
                <div id="exp-inputs"></div>
                <button class="btn-add" onclick="addExp()">+ إضافة خبرة</button>
            </div>

            <!-- الدورات التدريبية -->
            <div class="section-editor">
                <h3>الدورات التدريبية</h3>
                <div id="courses-inputs"></div>
                <button class="btn-add" onclick="addCourse()">+ إضافة دورة</button>
            </div>

            <!-- المهارات -->
            <div class="section-editor">
                <h3>المهارات</h3>
                <div id="skills-inputs"></div>
                <button class="btn-add" onclick="addSkill()">+ إضافة مهارة</button>
            </div>

            <!-- اللغات -->
            <div class="section-editor">
                <h3>اللغات</h3>
                <div id="lang-inputs"></div>
                <button class="btn-add" onclick="addLang()">+ إضافة لغة</button>
            </div>
        </div>

        <!-- المعاينة الحية للورقة -->
        <div class="preview-panel">
            <div class="cv-page">
                <h1 class="cv-name" id="out-name"></h1>

                <!-- التفاصيل الشخصية -->
                <div class="section-box">
                    <div class="section-header">التفاصيل الشخصية</div>
                    <div class="section-body">
                        <div class="personal-info-row"><b>عنوان البريد الإلكتروني:</b> <span id="out-email"></span></div>
                        <div class="personal-info-row"><b>رقم الهاتف:</b> <span id="out-phone"></span></div>
                        <div class="personal-info-row"><b>العنوان:</b> <span id="out-address"></span></div>
                        <div class="personal-info-row"><b>تاريخ الميلاد:</b> <span id="out-birth"></span></div>
                        <div class="personal-info-row"><b>الجنسية:</b> <span id="out-nat"></span></div>
                        <div class="personal-info-row"><b>الحالة الاجتماعية:</b> <span id="out-status"></span></div>
                    </div>
                </div>

                <div class="section-box">
                    <div class="section-header">المؤهلات الدراسية</div>
                    <div class="section-body" id="out-edu"></div>
                </div>

                <div class="section-box">
                    <div class="section-header">الخبرة العملية</div>
                    <div class="section-body" id="out-exp"></div>
                </div>

                <div class="section-box">
                    <div class="section-header">الدورات التدريبية</div>
                    <div class="section-body" id="out-courses"></div>
                </div>

                <div class="section-box">
                    <div class="section-header">المهارات</div>
                    <div class="section-body" id="out-skills" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;"></div>
                </div>

                <div class="section-box">
                    <div class="section-header">اللغات</div>
                    <div class="section-body" id="out-lang" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // البيانات الأولية والحالة العامة
        let state = {
            currentColor: '#3d5a80',
            edu: [
                { 
                    title: 'بكالوريوس تربية رياضية', 
                    sub: 'جامعة الأزهر، القاهرة', 
                    gpa: 'ممتاز مع مرتبة الشرف (3.85)', 
                    date: '2024' 
                }
            ],
            exp: [
                { 
                    title: 'أخصائي حجامة وتدليك', 
                    company: 'palancegym', 
                    date: 'فبراير 2023 - فبراير 2025', 
                    sub: 'مدينة نصر، القاهرة',
                    desc: 'تقديم جلسات الاستشفاء العضلي والحجامة والتدليك الرياضي والتأهيلي للعملاء والرياضيين مع متابعة برامج التأهيل بدقة.' 
                },
                { 
                    title: 'أخصائي تدليك واستشفاء', 
                    company: 'مركز شيل أوت مساج', 
                    date: 'يناير 2021 - يناير 2023', 
                    sub: 'مدينة نصر، القاهرة',
                    desc: 'تقديم الخدمات العلاجية والاسترخائية ومتابعة مدى رضى العملاء وتأهيل الحالات العضلية المختلفة.' 
                },
                { 
                    title: 'مدخل بيانات', 
                    company: 'شركة المتحدة للأدوية', 
                    date: 'فبراير 2019 - فبراير 2020', 
                    sub: 'مصر القديمة، القاهرة',
                    desc: 'إدخال بيانات المستحضرات والمخزون بدقة متناهية وتحديث السجلات الفنية وإعداد التقارير الدورية.' 
                },
                { 
                    title: 'مشرف عمال', 
                    company: 'شركة دولا لمنتجات الألبان', 
                    date: 'يناير 2018 - يناير 2019', 
                    sub: 'المنزلة، دقهلية',
                    desc: 'الإشراف على حركة العمال وتنظيم الورديات وضمان خطط الإنتاج والجودة المطلوبة.' 
                }
            ],
            courses: [
                { 
                    name: 'دورة تدليك وحجامة متقدمة', 
                    provider: 'ChillOut Team', 
                    date: 'يناير 2021',
                    desc: 'دراسة وتطبيق تقنيات الحجامة الجافة والرطبة وإصابات الأنسجة العضلية ومهارات الاستشفاء.' 
                },
                { 
                    name: 'دورة تدريبية في التدليك وإصابات الملعب', 
                    provider: 'MAGIC MASSAGE TEAM', 
                    date: 'فبراير 2022',
                    desc: 'التعامل مع الإسعافات الأولية وتدليك الإصابات الرياضية وتأهيل اللاعبين قبل وبعد المباريات.' 
                }
            ],
            skills: ['مهارات تواصل قوية مع العملاء والرياضيين', 'القدرة على العمل تحت الضغط', 'العمل بروح الفريق الجماعي', 'الدقة والاهتمام بالتفاصيل'],
            lang: [{ name: 'اللغة العربية', level: 'اللغة الأم (طلاقة)' }, { name: 'اللغة الإنجليزية', level: 'متوسط' }]
        };

        // بناء كروت المدخلات في اللوحة الجانبية
        function buildInputs() {
            // المؤهلات الدراسية
            document.getElementById('edu-inputs').innerHTML = state.edu.map((e, i) => `
                <div class="item-editor-card">
                    <button class="btn-del" onclick="state.edu.splice(${i},1); render();">حذف</button>
                    <div class="form-group"><label>المؤهل الدراسي / الدرجة</label><input type="text" value="${e.title || ''}" oninput="state.edu[${i}].title=this.value; renderCV();"></div>
                    <div class="form-group"><label>الجامعة / المؤسسة التعليمية</label><input type="text" value="${e.sub || ''}" oninput="state.edu[${i}].sub=this.value; renderCV();"></div>
                    <div class="form-group"><label>المعدل التراكمي (GPA / التقدير)</label><input type="text" value="${e.gpa || ''}" oninput="state.edu[${i}].gpa=this.value; renderCV();"></div>
                    <div class="form-group"><label>تاريخ التخرج</label><input type="text" value="${e.date || ''}" oninput="state.edu[${i}].date=this.value; renderCV();"></div>
                </div>
            `).join('');

            // الخبرة العملية
            document.getElementById('exp-inputs').innerHTML = state.exp.map((e, i) => `
                <div class="item-editor-card">
                    <button class="btn-del" onclick="state.exp.splice(${i},1); render();">حذف</button>
                    <div class="form-group"><label>المسمى الوظيفي</label><input type="text" value="${e.title || ''}" oninput="state.exp[${i}].title=this.value; renderCV();"></div>
                    <div class="form-group"><label>الجهة / الشركة</label><input type="text" value="${e.company || ''}" oninput="state.exp[${i}].company=this.value; renderCV();"></div>
                    <div class="form-group"><label>الفترة الزمنية</label><input type="text" value="${e.date || ''}" oninput="state.exp[${i}].date=this.value; renderCV();"></div>
                    <div class="form-group"><label>المكان / المدينة</label><input type="text" value="${e.sub || ''}" oninput="state.exp[${i}].sub=this.value; renderCV();"></div>
                    <div class="form-group"><label>الوصف والمهام الوظيفية</label><textarea oninput="state.exp[${i}].desc=this.value; renderCV();">${e.desc || ''}</textarea></div>
                </div>
            `).join('');

            // الدورات التدريبية
            document.getElementById('courses-inputs').innerHTML = state.courses.map((c, i) => `
                <div class="item-editor-card">
                    <button class="btn-del" onclick="state.courses.splice(${i},1); render();">حذف</button>
                    <div class="form-group"><label>اسم الدورة التدريبية</label><input type="text" value="${c.name || ''}" oninput="state.courses[${i}].name=this.value; renderCV();"></div>
                    <div class="form-group"><label>الجهة المنظمة</label><input type="text" value="${c.provider || ''}" oninput="state.courses[${i}].provider=this.value; renderCV();"></div>
                    <div class="form-group"><label>التاريخ / السنة</label><input type="text" value="${c.date || ''}" oninput="state.courses[${i}].date=this.value; renderCV();"></div>
                    <div class="form-group"><label>وصف وتفاصيل الدورة</label><textarea oninput="state.courses[${i}].desc=this.value; renderCV();">${c.desc || ''}</textarea></div>
                </div>
            `).join('');

            // المهارات
            document.getElementById('skills-inputs').innerHTML = state.skills.map((s, i) => `
                <div style="display:flex; gap:5px; margin-bottom:4px;">
                    <input type="text" value="${s}" style="width:100%; padding:4px;" oninput="state.skills[${i}]=this.value; renderCV();">
                    <button class="btn-del" style="float:none;" onclick="state.skills.splice(${i},1); render();">X</button>
                </div>
            `).join('');

            // اللغات
            document.getElementById('lang-inputs').innerHTML = state.lang.map((l, i) => `
                <div class="item-editor-card">
                    <button class="btn-del" onclick="state.lang.splice(${i},1); render();">حذف</button>
                    <div class="form-group"><label>اللغة</label><input type="text" value="${l.name || ''}" oninput="state.lang[${i}].name=this.value; renderCV();"></div>
                    <div class="form-group"><label>المستوى</label><input type="text" value="${l.level || ''}" oninput="state.lang[${i}].level=this.value; renderCV();"></div>
                </div>
            `).join('');
        }

        // عرض وتحديث المعاينة في ورقة السيرة الذاتية
        function renderCV() {
            // البيانات الشخصية
            document.getElementById('out-name').innerText = document.getElementById('in-name').value;
            document.getElementById('out-email').innerText = document.getElementById('in-email').value;
            document.getElementById('out-phone').innerText = document.getElementById('in-phone').value;
            document.getElementById('out-address').innerText = document.getElementById('in-address').value;
            document.getElementById('out-birth').innerText = document.getElementById('in-birth').value;
            document.getElementById('out-nat').innerText = document.getElementById('in-nat').value;
            document.getElementById('out-status').innerText = document.getElementById('in-status').value;

            // المؤهلات
            document.getElementById('out-edu').innerHTML = state.edu.map((e, i) => `
                <div style="${i > 0 ? 'border-top:1px solid #f1f5f9; padding-top:6px; margin-top:6px;' : ''}">
                    <div class="info-row">
                        <span style="font-weight: bold; font-size: 13px;">${e.title || ''}</span>
                        ${e.date ? `<span style="font-size:12px; color:#64748b;">تاريخ التخرج: ${e.date}</span>` : ''}
                    </div>
                    <div style="color: #64748b; font-size: 12px; font-weight: 600;">${e.sub || ''}</div>
                    ${e.gpa ? `<div style="color: #475569; font-size: 12px; margin-top:2px;"><b>المعدل التراكمي:</b> ${e.gpa}</div>` : ''}
                </div>
            `).join('');

            // الخبرة العملية
            document.getElementById('out-exp').innerHTML = state.exp.map((e, i) => `
                <div style="${i > 0 ? 'border-top:1px solid #f1f5f9; padding-top:6px; margin-top:6px;' : ''}">
                    <div class="info-row">
                        <span style="font-weight:bold; font-size:13px;">${e.title || ''} ${e.company ? `— ${e.company}` : ''}</span>
                        <span style="font-size:12px; color:#64748b;">${e.date || ''}</span>
                    </div>
                    ${e.sub ? `<div style="color: #3d5a80; font-size: 11.5px; font-weight: 600;">${e.sub}</div>` : ''}
                    ${e.desc ? `<div class="item-desc">${e.desc}</div>` : ''}
                </div>
            `).join('');

            // الدورات التدريبية
            document.getElementById('out-courses').innerHTML = state.courses.map((c, i) => `
                <div style="${i > 0 ? 'border-top:1px solid #f1f5f9; padding-top:6px; margin-top:6px;' : ''}">
                    <div class="info-row">
                        <span style="font-weight:bold; font-size:13px;">${c.name || ''} ${c.provider ? `(${c.provider})` : ''}</span>
                        <span style="font-size:12px; color:#64748b;">${c.date || ''}</span>
                    </div>
                    ${c.desc ? `<div class="item-desc">${c.desc}</div>` : ''}
                </div>
            `).join('');

            // المهارات
            document.getElementById('out-skills').innerHTML = state.skills.map(s => `<div>• ${s}</div>`).join('');

            // اللغات
            document.getElementById('out-lang').innerHTML = state.lang.map(l => `<div><b>${l.name}:</b> ${l.level}</div>`).join('');
        }

        function render() {
            buildInputs();
            renderCV();
        }

        // إضافات العناصر
        function addEdu() { state.edu.push({ title: 'مؤهل جديد', sub: 'الجامعة', gpa: '', date: '' }); render(); }
        function addExp() { state.exp.push({ title: 'وظيفة جديدة', company: 'الشركة', date: 'الفترة', sub: 'المكان', desc: '' }); render(); }
        function addCourse() { state.courses.push({ name: 'دورة جديدة', provider: 'الجهة', date: 'التاريخ', desc: '' }); render(); }
        function addSkill() { state.skills.push('مهارة جديدة'); render(); }
        function addLang() { state.lang.push({ name: 'لغة جديدة', level: 'المستوى' }); render(); }

        // تغيير السمة اللونية للعناوين
        function changeColor(color, btn) {
            state.currentColor = color;
            document.querySelectorAll('.section-header').forEach(h => h.style.backgroundColor = color);
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // التشغيل الأولي للملف
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
